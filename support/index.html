<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サポート | Arise（禁欲チャレンジ）</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0; }
      main { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
      .card { border: 1px solid rgba(127,127,127,.3); border-radius: 12px; padding: 16px; margin: 12px 0; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      a { text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="../">← トップ</a></p>
      <h1>サポート</h1>

      <div class="card">
        <h2>お問い合わせ</h2>
        <p>アプリ内の「お問い合わせ」からご連絡ください。</p>
        <p>メール: <a href="mailto:kinyoku.app.team@gmail.com">kinyoku.app.team@gmail.com</a></p>
      </div>

      <div class="card">
        <h2>よくある質問</h2>
        <ul>
          <li>ログインメールが届かない → 迷惑メール/受信拒否設定を確認し、数分待ってから再送してください。</li>
          <li>アプリが動かない → アプリを再起動し、最新版へ更新してください。</li>
        </ul>
      </div>

      <div class="card">
        <h2>不具合報告のコツ</h2>
        <ul>
          <li>発生日時</li>
          <li>端末（iPhoneの機種名 / iOSバージョン）</li>
          <li>どの画面で何をしたか</li>
          <li>スクショ（可能なら）</li>
        </ul>
      </div>
    </main>
  </body>
</html>
